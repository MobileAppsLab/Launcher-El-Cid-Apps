<title>El Cid Apps</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px;color:#333}
.app{max-width:700px;margin:auto}
.header{width:100%;height:90px;display:flex;align-items:center;border:1px solid #777;border-radius:1px;background:linear-gradient(to bottom,#f8f8f8 0%,#dedede 48%,#c4c4c4 100%);box-shadow:inset 0 0 0 2px #e8e8e8,0 1px 3px rgba(0,0,0,.35);padding:3px 10px 3px 5px;margin:0 0 18px;overflow:hidden}
.header-logo{width:210px;height:82px;display:flex;align-items:center;justify-content:flex-start;flex:0 0 210px}
.header-logo img{width:200px;height:76px;object-fit:contain;display:block}
.header-text{flex:1;text-align:right;padding-right:5px;line-height:1}
.brand{font-size:28px;font-weight:700;font-style:italic;color:#555;text-shadow:1px 1px 1px #fff,0 1px 2px rgba(0,0,0,.35);white-space:nowrap}
.subtitle{font-size:22px;font-weight:600;font-style:italic;color:#666;margin-top:9px;text-shadow:1px 1px 1px #fff}
#apps{max-width:700px;margin:auto}
button{width:100%;padding:16px;margin:6px 0;font-size:17px;border:0;border-radius:10px;background:#176b3a;color:white;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
@media(max-width:600px){.header{height:86px;padding:3px 6px 3px 4px}.header-logo{width:150px;height:80px;flex-basis:150px}.header-logo img{width:145px;height:74px}.brand{font-size:21px}.subtitle{font-size:17px;margin-top:7px}}
</style>

<script>
const owner = "mobileappslab";
const hiddenRepo = "Launcher";
fetch(`https://api.github.com/users/${owner}/repos?per_page=100`)
  .then(r => r.json())
  .then(repos => {
    const apps = document.getElementById("apps");
    apps.innerHTML = "";
    repos
      .filter(repo => repo.name !== hiddenRepo && repo.name.includes("El_Cid"))
      .sort((a,b) => a.name.localeCompare(b.name))
      .forEach(repo => {
        const button = document.createElement("button");
        button.textContent = repo.name;
        button.onclick = () => {
          window.open(`https://${owner}.github.io/${repo.name}/`, "_blank");
        };
        apps.appendChild(button);
      });
  })
  .catch(() => {
    document.getElementById("apps").textContent = "Unable to load repositories.";
  });
</script>
